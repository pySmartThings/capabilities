id: samsungim.nearbyDetection
version: 1
status: proposed
name: Nearby Detection
ephemeral: false
attributes:
  status:
    schema:
      type: object
      properties:
        value:
          title: status
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    enumCommands:
      - command: "on"
        value: "on"
      - command: "off"
        value: "off"
commands:
  refresh:
    name: refresh
    arguments: []
    sensitive: false
  stfInstalled:
    name: stfInstalled
    arguments:
      - name: installedAppId
        optional: false
        schema:
          type: string
    sensitive: false
  stfUninstalled:
    name: stfUninstalled
    arguments:
      - name: installedAppId
        optional: false
        schema:
          type: string
    sensitive: false
  "off":
    name: "off"
    arguments: []
    sensitive: false
  "on":
    name: "on"
    arguments: []
    sensitive: false
