id: samsungce.audioMute
version: 1
status: proposed
name: Audio Mute
ephemeral: false
attributes:
  isMuteable:
    schema:
      type: object
      properties:
        value:
          type: boolean
          default: true
      additionalProperties: false
      required:
        - value
    enumCommands: []
  mute:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - muted
            - unmuted
      additionalProperties: false
      required:
        - value
    setter: setMute
    enumCommands: []
commands:
  setMute:
    name: setMute
    arguments:
      - name: mute
        optional: false
        schema:
          type: string
          enum:
            - muted
            - unmuted
    sensitive: false
  mute:
    name: mute
    arguments: []
    sensitive: false
  unmute:
    name: unmute
    arguments: []
    sensitive: false
