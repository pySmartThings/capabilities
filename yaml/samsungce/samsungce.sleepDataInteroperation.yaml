    name: setResultFeedback
    arguments:
      - name: resultFeedback
        optional: false
        schema:
          type: string
          enum:
            - none
            - good
            - tooCold
            - tooWarm
    sensitive: false
  setSleepStatus:
    name: setSleepStatus
    arguments:
      - name: sleepStatus
        optional: false
        schema:
          type: string
          enum:
            - sleepOnset
            - awake
    sensitive: false
  setConnectedDevicesWithName:
    name: setConnectedDevicesWithName
    arguments:
      - name: connectedDevicesWithName
        optional: false
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
    sensitive: false
  enable:
    name: enable
    arguments: []
    sensitive: false
  disable:
    name: disable
    arguments: []
    sensitive: false
  setSleepData:
    name: setSleepData
    arguments:
      - name: sleepData
        optional: false
        schema:
          type: object
          additionalProperties: false
          properties:
            deviceId:
              type: string
            sequenceNumber:
              type: integer
              minimum: 0
              maximum: 99
            sleepStages:
              type: string
            start:
              type: string
              pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
            end:
              type: string
              pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
    sensitive: false
  setConnectedDevices:
    name: setConnectedDevices
    arguments:
      - name: connectedDevices
        optional: false
        schema:
          type: array
          items:
            type: string
    sensitive: false
  setDataActivated:
    name: setDataActivated
    arguments:
      - name: dataActivated
        optional: false
        schema:
          type: boolean
    sensitive: false
