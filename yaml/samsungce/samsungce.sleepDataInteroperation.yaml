id: samsungce.sleepDataInteroperation
version: 1
status: proposed
name: Sleep Data Interoperation
ephemeral: false
attributes:
  sleepStatus:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - sleepOnset
            - awake
      additionalProperties: false
      required:
        - value
    enumCommands: []
  requestFeedback:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - none
            - aiSleep
      additionalProperties: false
      required:
        - value
    enumCommands: []
  resultFeedback:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - none
            - good
            - tooCold
            - tooWarm
      additionalProperties: false
      required:
        - value
    setter: setResultFeedback
    enumCommands: []
  dataActivated:
    schema:
      type: object
      properties:
        value:
          type: boolean
      additionalProperties: false
      required:
        - value
    setter: setDataActivated
    enumCommands: []
  linkageStartTime:
    schema:
      type: object
      properties:
        value:
          type: string
          pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
      additionalProperties: false
      required:
        - value
    enumCommands: []
  sleepData:
    schema:
      type: object
      properties:
        value:
          type: object
          additionalProperties: false
          properties:
            deviceId:
              type: string
            sequenceNumber:
              type: integer
              minimum: 0
              maximum: 99
            sleepStages:
              type: string
            start:
              type: string
              pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
            end:
              type: string
              pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
      additionalProperties: false
      required:
        - value
    enumCommands: []
  maxDevices:
    schema:
      type: object
      properties:
        value:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
        - value
    enumCommands: []
  linkageStopTime:
    schema:
      type: object
      properties:
        value:
          type: string
          pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
      additionalProperties: false
      required:
        - value
    enumCommands: []
  connectedDevices:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
        - value
    enumCommands: []
  enabled:
    schema:
      type: object
      properties:
        value:
          type: boolean
      additionalProperties: false
      required:
        - value
    enumCommands: []
  linkageStatus:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - idle
            - active
      additionalProperties: false
      required:
        - value
    enumCommands: []
  connectedDevicesWithName:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
            required:
              - id
              - name
      additionalProperties: false
      required:
        - value
    enumCommands: []
