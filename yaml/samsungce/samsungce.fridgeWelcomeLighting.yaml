id: samsungce.fridgeWelcomeLighting
version: 1
status: proposed
name: Fridge Welcome Lighting
ephemeral: false
attributes:
  reactionTime:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - fast
            - normal
            - slow
      additionalProperties: false
      required:
        - value
    setter: setReactionTime
    enumCommands: []
  detectionProximity:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - nearest
            - near
            - middle
            - far
      additionalProperties: false
      required:
        - value
    setter: setDetectionProximity
    enumCommands: []
  supportedReactionTimes:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - fast
              - normal
              - slow
      additionalProperties: false
      required:
        - value
    enumCommands: []
  name:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - WelcomeLighting
            - AutoView
            - WelcomeDisplay
      additionalProperties: false
      required:
        - value
    enumCommands: []
  supportedDetectionProximities:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - nearest
              - near
              - middle
              - far
      additionalProperties: false
      required:
        - value
    enumCommands: []
  status:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    enumCommands: []
commands:
  setReactionTime:
    name: setReactionTime
    arguments:
      - name: reactionTime
        optional: false
        schema:
          type: string
          enum:
            - fast
            - normal
            - slow
    sensitive: false
  setDetectionProximity:
    name: setDetectionProximity
    arguments:
      - name: detectionProximity
        optional: false
        schema:
          type: string
          enum:
            - nearest
            - near
            - middle
            - far
    sensitive: false
  "off":
    name: "off"
    arguments: []
    sensitive: false
  "on":
    name: "on"
    arguments: []
    sensitive: false
