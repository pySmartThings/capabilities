id: samsungce.statefulLamp
version: 1
status: proposed
name: Stateful Lamp
ephemeral: false
attributes:
  brightnessLevel:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - low
            - mid
            - high
            - extraHigh
            - smart
      additionalProperties: false
      required:
        - value
    enumCommands: []
  supportedBrightnessLevel:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - low
              - mid
              - high
              - extraHigh
              - smart
      additionalProperties: false
      required:
        - value
    enumCommands: []
  switch:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    enumCommands: []
commands:
  setBrightnessLevel:
    name: setBrightnessLevel
    arguments:
      - name: brightnessLevel
        optional: false
        schema:
          type: string
          enum:
            - low
            - mid
            - high
            - extraHigh
            - smart
    sensitive: false
  "off":
    name: "off"
    arguments: []
    sensitive: false
  "on":
    name: "on"
    arguments: []
    sensitive: false
