id: samsungce.robotCleanerOperatingState
version: 1
status: proposed
name: Robot Cleaner Operating State
ephemeral: false
attributes:
  supportedOperatingState:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - idle
              - standby
              - homing
              - cleaning
              - charging
              - chargingForRemainingJob
              - charged
              - creatingMap
              - drainingWater
              - flexCharged
              - moving
              - paused
              - error
              - relocal
              - descaling
              - waitingForDescaling
              - exploring
              - emitDust
              - monitoring
              - monitoringAutomation
              - patrol
              - manual
              - processing
              - mediaPlaying
              - messaging
              - findingPet
              - reserved
              - factoryReset
              - calibrating
              - welcoming
              - detachingMopPad
              - waitingForChangingMopPad
              - attachingMopPad
              - attachingMopPadForRemainingJob
              - washingMop
              - sterilizingMop
              - dryingMop
              - mopWashingPaused
              - spinDrying
              - preparingWater
              - supplyingWater
              - sabbath
              - powerSaving
              - suspend
              - emptyStation
              - internalWash
              - cleaningStart
              - cleaningEnd
      additionalProperties: false
      required:
        - value
    enumCommands: []
  powerSavingReason:
    schema:
      type: object
      properties:
        value:
          type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              enum:
                - none
                - userCommand
                - powerSaving
                - lowBattery
                - lowBatteryWhileCleaning
                - noStationSignal
                - noStationFound
                - liquidBlockStation
                - error
            lastUpdatedTime:
              type: string
              pattern: ^(?:[1-9]\d{3}-?(?:(?:0[1-9]|1[0-2])-?(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-?(?:29|30)|(?:0[13578]|1[02])-?31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-?02-?29)T(?:[01]\d|2[0-3]):?[0-5]\d:?[0-5]\d(?:\.\d{3})?(?:Z|[+-][01]\d(?::?[0-5]\d)?)$
            lastPosition:
              type: array
              items:
                type: string
              maxItems: 2
      additionalProperties: false
      required:
        - value
    enumCommands: []
  operatingState:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - idle
            - standby
            - homing
            - cleaning
            - charging
            - chargingForRemainingJob
            - charged
            - creatingMap
            - drainingWater
            - flexCharged
            - moving
            - paused
            - error
            - relocal
            - descaling
            - waitingForDescaling
            - exploring
            - emitDust
            - monitoring
            - monitoringAutomation
            - patrol
            - manual
            - processing
            - mediaPlaying
            - messaging
            - findingPet
            - reserved
            - factoryReset
            - calibrating
            - welcoming
            - detachingMopPad
            - waitingForChangingMopPad
            - attachingMopPad
            - attachingMopPadForRemainingJob
            - washingMop
            - sterilizingMop
            - dryingMop
            - mopWashingPaused
            - spinDrying
            - preparingWater
            - supplyingWater
            - sabbath
            - powerSaving
            - suspend
            - emptyStation
            - internalWash
            - cleaningStart
            - cleaningEnd
      additionalProperties: false
      required:
        - value
    setter: setOperatingState
    enumCommands: []
  cleaningStep:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - none
            - mopping
            - vacuuming
            - oneStepCleaning
      additionalProperties: false
      required:
        - value
    enumCommands: []
  homingReason:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - none
            - lowBattery
            - cleaningCompleted
            - cleaningCanceled
            - relocalFailed
            - dustFulled
            - mapCreated
            - doNotDisturb
            - changingMopPad
            - washingMop
            - supplyingWater
            - completeVacuuming
      additionalProperties: false
      required:
        - value
    enumCommands: []
  wheelsLiftedUp:
    schema:
      type: object
      properties:
        value:
          type: boolean
          default: false
      additionalProperties: false
      required:
        - value
    enumCommands: []
  showLiveMapOnSuspend:
    schema:
      type: object
      properties:
        value:
          type: boolean
          default: false
      additionalProperties: false
      required:
        - value
    enumCommands: []
  batteryOverheating:
    schema:
      type: object
      properties:
        value:
          type: boolean
          default: false
      additionalProperties: false
      required:
        - value
    enumCommands: []
  flexChargingPlan:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - avoidPeak
            - onlyOffPeak
            - carbonReducing
            - none
      additionalProperties: false
      required:
        - value
    enumCommands: []
  isMapBasedOperationAvailable:
    schema:
      type: object
      properties:
        value:
          type: boolean
          default: false
      additionalProperties: false
      required:
        - value
    enumCommands: []
commands:
  resume:
    name: resume
    arguments: []
    sensitive: false
  setOperatingState:
    name: setOperatingState
    arguments:
      - name: operatingState
        optional: false
        schema:
          type: string
          enum:
            - homing
            - cleaning
            - paused
            - findingPet
            - findingPerson
            - monitoringAutomation
            - emitDust
            - suspend
            - wakeup
    sensitive: false
  returnToHome:
    name: returnToHome
    arguments: []
    sensitive: false
  start:
    name: start
    arguments: []
    sensitive: false
  drawMap:
    name: drawMap
    arguments:
      - name: withCleaning
        optional: false
        schema:
          type: boolean
    sensitive: false
  pause:
    name: pause
    arguments: []
    sensitive: false
  cancelRemainingJob:
    name: cancelRemainingJob
    arguments: []
    sensitive: false
