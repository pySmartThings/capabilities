id: samsungce.fridgeVacationMode
version: 1
status: proposed
name: Fridge Vacation Mode
ephemeral: false
attributes:
  vacationMode:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    setter: setVacationMode
    enumCommands: []
  supportedVacationModes:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - "on"
              - "off"
      additionalProperties: false
      required:
        - value
    enumCommands: []
commands:
  setVacationMode:
    name: setVacationMode
    arguments:
      - name: vacationMode
        optional: false
        schema:
          type: string
          enum:
            - "on"
            - "off"
    sensitive: false
