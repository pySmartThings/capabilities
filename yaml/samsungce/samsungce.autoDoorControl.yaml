id: samsungce.autoDoorControl
version: 1
status: proposed
name: Auto Door Control
ephemeral: false
attributes:
  safeClosingTime:
    schema:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum:
            - min
          default: min
      additionalProperties: false
      required:
        - value
    setter: setSafeClosingTime
    enumCommands: []
  supportedSafeClosingTimes:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: integer
            minimum: 0
      additionalProperties: false
      required:
        - value
    enumCommands: []
  supportedControlSounds:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: string
            enum:
              - "on"
              - "off"
      additionalProperties: false
      required:
        - value
    enumCommands: []
  controlSound:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    setter: setControlSound
    enumCommands: []
  autoDoorControl:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    setter: setAutoDoorControl
    enumCommands: []
commands:
  setAutoDoorControl:
    name: setAutoDoorControl
    arguments:
      - name: autoDoorControl
        optional: false
        schema:
          type: string
          enum:
            - "on"
            - "off"
    sensitive: false
  setControlSound:
    name: setControlSound
    arguments:
      - name: controlSound
        optional: false
        schema:
          type: string
          enum:
            - "on"
            - "off"
    sensitive: false
  setSafeClosingTime:
    name: setSafeClosingTime
    arguments:
      - name: safeClosingTime
        optional: false
        schema:
          type: integer
          minimum: 0
    sensitive: false
