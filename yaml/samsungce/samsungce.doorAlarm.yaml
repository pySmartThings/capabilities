id: samsungce.doorAlarm
version: 1
status: proposed
name: Door Alarm
ephemeral: false
attributes:
  doorAlarm:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - "on"
            - "off"
      additionalProperties: false
      required:
        - value
    enumCommands: []
  supportedAlarmSounds:
    schema:
      type: object
      properties:
        value:
          type: array
          items:
            type: integer
            minimum: 0
      additionalProperties: false
      required:
        - value
    enumCommands: []
  alarmSound:
    schema:
      type: object
      properties:
        value:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
        - value
    setter: setAlarmSound
    enumCommands: []
commands:
  setAlarmSound:
    name: setAlarmSound
    arguments:
      - name: alarmSound
        optional: false
        schema:
          type: integer
          minimum: 0
    sensitive: false
  "off":
    name: "off"
    arguments: []
    sensitive: false
  "on":
    name: "on"
    arguments: []
    sensitive: false
